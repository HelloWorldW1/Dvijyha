<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07080b">
    <title>Рассказы</title>
    <style>

:root{
    --bg:#07080b;--panel:#11131a;--panel2:#181b24;
    --text:#f5f0e6;--muted:#aaa7a0;--gold:#d8b567;
    --gold2:#f0d58e;--line:rgba(216,181,103,.24);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
    margin:0;min-height:100vh;background:
    radial-gradient(circle at 50% -10%,rgba(216,181,103,.13),transparent 34%),
    linear-gradient(180deg,#090a0e,#07080b);
    color:var(--text);font-family:Inter,Arial,sans-serif;
}
.page{width:min(100%,900px);margin:auto;padding:18px 16px 60px}
.brand{font-family:Georgia,serif;font-size:1.5rem;font-weight:700;margin-bottom:30px}
.brand span{color:var(--gold)}
.story{padding-top:15px}
.breadcrumb{color:var(--muted);font-size:.8rem;line-height:1.5;margin-bottom:10px}
h1{margin:0;font:700 clamp(2.2rem,8vw,4rem)/.95 Georgia,serif;color:var(--gold2)}
.chapter{margin:8px 0 28px;color:var(--gold);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.story-text{
    padding:24px 20px;border:1px solid var(--line);border-radius:22px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
}
.story-text p{margin:0 0 18px;color:#e9e4da;font-size:.96rem;line-height:1.85}
.story-text p:last-child{margin-bottom:0}
.story-nav{display:flex;gap:10px;margin-top:24px}
.story-nav a{
    flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:15px;
    background:rgba(216,181,103,.045);color:var(--gold2);
    font-weight:700;text-align:center;
}
.story-nav .disabled{visibility:hidden}
@media(max-width:520px){
    .story-nav{flex-direction:column}
    .story-nav .disabled{display:none}
    .story-text{padding:20px 16px}
}

.story-card{
    display:block;padding:22px;border:1px solid var(--line);border-radius:20px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));text-decoration:none;color:inherit;
}
.story-card h2{margin:4px 0 14px;font:700 clamp(1.9rem,7vw,2.7rem) Georgia,serif;color:var(--gold2)}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.part{padding:8px 10px;border:1px solid rgba(216,181,103,.16);border-radius:12px;font-size:.82rem}
.kicker{color:var(--gold);font-size:.72rem;font-weight:800;letter-spacing:.17em;text-transform:uppercase}
    </style>
</head>
<body>
    <div class="page">
        <div class="brand">Движушные <span>Войска</span></div>

        <main>
            <div class="kicker">Архив рассказов</div>
            <h1 style="margin:8px 0 26px;">Рассказы</h1>

            <a class="story-card" href="stories/black-man.html">
                <div class="kicker">Кампания №01</div>
                <h2>Кампания «Black Man»</h2>

                <div class="parts">
                    <span class="part">Предисловье</span>
                    <span class="part">Операция «Африканский Бросок»</span>
                    <span class="part">План Бургероса</span>
                    <span class="part">Проект «Black Man»</span>
                </div>
            </a>
        </main>
    </div>
</body>
</html>
